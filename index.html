<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco Adventure VR</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js" ></script>
  <script src="https://cdn.jsdelivr.net/gh/supermedium/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  <script src="https://unpkg.com/@c-frame/aframe-particle-system-component@1.2.x/dist/aframe-particle-system-component.min.js"></script>  
<script src="https://unpkg.com/@c-frame/aframe-physics-system@4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>

  <script src="script.js"></script>
</head>
<body>
  <div id="scene-ui" style="position:fixed;top:20px;left:0;width:100vw;z-index:10;display:flex;justify-content:center;pointer-events:auto;">
    <div style="background:#fffbe7;border-radius:10px;box-shadow:0 2px 8px #aaa;padding:20px;display:flex;gap:40px;align-items:flex-start;">
      <div id="river-puzzle-ui" style="min-width:200px;text-align:center;">
        <h2>River Puzzle</h2>
        <div id="river-puzzle-hint" style="display:none;color:#1976d2;margin-bottom:10px;"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <button id="play-btn" style="font-size:1.2em;padding:8px 24px;">Play</button>
        <button id="hint-btn" style="font-size:1em;padding:6px 18px;">Hint</button>
        <div id="hint-text" style="display:none;margin-top:10px;color:#333;font-size:1.1em;"></div>
      </div>
      <div id="fire-puzzle-ui" style="min-width:200px;text-align:center;">
        <h2>Fire Puzzle</h2>
        <div id="fire-puzzle-hint" style="display:none;color:#d84315;margin-bottom:10px;"></div>
      </div>
    </div>
  </div>
  <a-scene puzzle-manager loading-screen="dotsColor: red; backgroundColor: black">
 <a-assets>
    <a-asset-item id="plants" src="models/moss_01_4k.glb"></a-asset-item>
    <a-asset-item id="palm" src="models/palm.fbx"></a-asset-item>
    <a-asset-item id="Roses" src="models/Roses.glb"></a-assest-item>
    <a-asset-item id="sunflower" src="models/Sunflower.glb"></a-assest-item>
    <a-asset-item id="red_flower" src="models/Simple red flower.glb"></a-assest-item>
    <a-asset-item id="flower_pot" src="models/Flower Pot.glb"></a-assest-item>
    <a-asset-item id="waterBucket" src="models/water_bucket.glb"></a-asset-item>
    <a-asset-item id="firePit" src="models/fire_pit.glb"></a-asset-item>
    <audio id="waterPickup" src="sounds/water_pickup.wav"></audio>
    <img id="groundTexture" src="images/ground.jpg">
    <img id="skyTexture" src="images/wide-shot-field-covered-with-grass-full-beautiful-trees-captured-day-time.jpg">
    <audio id="bg-sound" src="sounds/bgsound.wav"></audio>
    <audio id="popup-sound" src="sounds/popup.wav"></audio>
    <audio id="fireSound" src="sounds/fire_sound.wav"></audio>
    <a-asset-item id="boulder-model" src="models/boulder1.glb"></a-asset-item>
    <img id="dry-river-tex" src="images/dry_river.jpg">
    <img id="water-tex" src="images/flowing_river.jpg">
  </a-assets>

    <a-sky src="#skyTexture" color="#FFF"></a-sky>
  	 <a-entity light="type: ambient; color: #BBB;"></a-entity>
<a-entity light="type: directional; color:#FFF; intensity:0.6;" position="-0.5 1 1"></a-entity>
    <a-box  class="clickable" event-set__enter="_event:mouseenter; color:#FF0000 " log="message:box is created" position="2 0 2" color="#FFF" 
           event-set__leave="_event: mouseleave; color: #4CC3D9"></a-box>
     <!-- <a-plane  position="0 -2 -4" rotation="-90 0 0" width="40" height="40" color="#7BC8A4" repeat="20 20" src="#groundTexture"
             event-set__down="_event:mousedown; material.wireframe: true"
             event-set__up="_event:mouseup; material.wireframe: false"
             event-set__leave="_event: mouseleave;material.wireframe:false"></a-plane> -->
    <a-cylinder  class="clickable" position="2 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"
                event-set__enter="_event: mouseenter; _target: #cylinderText; visible: true"
                event-set__leave="_event: mouseleave; _target: #cylinderText; visible: false">
      <a-text id="cylinderText" value="This is a cylinder" align="center" color="#FFF" visible="false" position="0 -0.55 0.55"
              geometry="primitive: plane; width: 1.75" material="color: #333"></a-text>
           </a-cylinder>


<a-entity>
  <a-entity
  id="fire"
  position="10 0.5 -10"
  particle-system="preset: default; color: #FF0000, #FFFF00;"
  sound="src: #fireSound; autoplay: true; loop: true;"
  class="clickable">
  </a-entity>
  <a-gltf-model src="#firePit" position="10 0 -10"></a-gltf-model>
</a-entity>


<a-gltf-model
  id="waterSource"
  position="13 0.1 -10"
  src="#waterBucket"
  class="clickable"
  >
</a-gltf-model>

<a-entity id="riverPuzzle" river-puzzle-manager>

    <a-plane
        id="riverBed"
        position="-6 0.26 -12"
        rotation="-90 0 0"
        width="4"
        height="10"
        material="src: #dry-river-tex; repeat: 2 5;">
    </a-plane>

    <a-plane
        id="riverFlow"
        position="-6 0.29 -12"
        rotation="-90 0 0"
        width="4"
        height="10"
        material="src: #water-tex; repeat: 2 5; transparent: true;"
        visible="false"
        flow-animation>  </a-plane>

      <a-entity environment="preset: forest; groundColor: #0F0; skyColor: #88c;"></a-entity>

    <a-entity id="boulder1" class="boulder clickable" gltf-model="#boulder-model" position="-11 0.5 -15"></a-entity>
    <a-entity id="boulder2" class="boulder clickable" gltf-model="#boulder-model" position="-11 0.5 -13"></a-entity>
    <a-entity id="boulder3" class="boulder clickable" gltf-model="#boulder-model" position="-11 0.5 -11"></a-entity>

</a-entity>




<a-entity>
  <a-gltf-model change-color-on-hover class="clickable" src="#Roses" position="0 1 -5" id="RosesModel" flower
  event-set__enter="_event: mouseenter; _target: #rosesText; visible: true"
  event-set__leave="_event: mouseleave; _target: #rosesText; visible: false">
    <a-text id="rosesText" value="Roses (CLick to know more)." align="center" color="#FFF" visible="false" position="0 -0.55 0.55"
              geometry="primitive: plane; width: 3.0" material="color: #333"></a-text>
  </a-gltf-model>
</a-entity>

    <!-- Educational popup (hidden until triggered) -->
    <a-entity id="popup" visible="false" position="0 1.6 -1.5">
      <a-plane width="1.6" height="0.7" color="#111" opacity="0.95"></a-plane>
      <a-entity text="value: Species: Golden Tamarin\nStatus: Endangered\nClick to close.; color: #FFF; align: center; width: 1.4" position="0 0 0.01"></a-entity>
    </a-entity>



    <!-- Sounds -->
    <a-entity id="popupSound" sound="src: #popup-sound; autoplay: false; volume: 1"></a-entity>
        <a-entity id="bgsound" sound="src: #bg-sound; autoplay: true; loop: true; volume: 5"></a-entity>

<a-entity id="player">
<a-entity id="leftHand" hand-controls="hand: left; handModelStyle: lowPoly; color: #ffcccc"></a-entity>
<a-entity id="rightHand" hand-controls="hand: right; handModelStyle: lowPoly; color: #ffcccc"></a-entity>  
    <a-camera wasd-controls="fly:true">
      <!-- Cursor configured to click objects with class 'clickable' -->
      <a-entity cursor="fuse: false; " raycaster="objects: .clickable" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015" material="color: #CCC; shader: flat" position="0 0 -1"></a-entity>
    </a-camera>
</a-entity>


  </a-scene>
  <h4>Credits:Roses by Christopher F [CC-BY] via Poly Pizza
    Flower Pot by Zsky [CC-BY] via Poly Pizza
    Simple red flower by Karlien [CC-BY] via Poly Pizza
    Sunflower by jeremy [CC-BY] via Poly Pizza
  </h4>
</body>
</html>
